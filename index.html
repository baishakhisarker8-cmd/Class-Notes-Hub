<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - NoteNest</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <meta name="google-site-verification" content="dgn1mik4ktdmAnjMPD6_x2VxxAfdI7pdc4RXHFmm3vc" />
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2>🔐 NoteNest Login</h2>
            <p style="color: #64748b; margin-bottom: 20px;">Access your notes and online exams</p>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="e.g., student@gmail.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Sign In</button>
            </form>
            
            <p style="margin-top: 20px; font-size: 14px; color: #475569;">
                New Student? <a href="signup.html" style="color: #4f46e5; font-weight: 600; text-decoration: none;">Create an Account</a>
            </p>

            <div style="margin-top: 25px; font-size: 13px; color: #94a3b8; text-align: left; background: #f8fafc; padding: 10px; border-radius: 6px;">
                <strong>👨‍🏫 Admin Accounts:</strong><br>
                • admin@gmail.com (Pass: 123456)<br>
                • baishakhi@gmail.com (Pass: secret123)
            </div>
        </div>
    </div>

    <script>
        // Your Firebase Configuration (From dashboard.html)
        const firebaseConfig = {
            apiKey: "AIzaSyBKkjDB1ickFQ9FJdvGENQQ7ZeLk7hnBGI",
            authDomain: "class-notes-hub-61b20.firebaseapp.com",
            projectId: "class-notes-hub-61b20",
            storageBucket: "class-notes-hub-61b20.appspot.com",
            messagingSenderId: "112494248768",
            appId: "1:112494248768:web:ea968e4f0c2ffcc39c70a5",
            measurementId: "G-69S13B95M6"
        };
        
        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            // 1. হhardcoded admin credentials check
            if ((email === 'baishakhisarker8@gmail.com' && password === 'sreya@2696') || 
                (email === 'aporajitaaditi@gmail.com' && password === 'aditi@06')) {
                localStorage.setItem('role', 'admin');
                localStorage.setItem('userEmail', email);
                window.location.href = 'dashboard.html';
                return;
            }

            // 2. students check in Firestore
            try {
                const userDoc = await db.collection('users').doc(email).get();
                
                if (!userDoc.exists) {
                    alert('❌ User not found! Please Sign Up first.');
                } else {
                    const userData = userDoc.data();
                    // password making sure to compare with the stored password in Firestore
                    if (userData.password === password) {
                        localStorage.setItem('role', 'student');
                        localStorage.setItem('userEmail', email);
                        window.location.href = 'dashboard.html';
                    } else {
                        // 🛑 if password doesn't match, show error message
                        alert('❌ Incorrect Password! Please try again.');
                    }
                }
            } catch (error) {
                console.error("Login Error: ", error);
                alert('⚡ Something went wrong. Check internet connection!');
            }
        });
    </script>
</body>
</html>
