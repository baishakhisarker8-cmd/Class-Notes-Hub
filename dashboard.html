<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NoteNest (Firebase Connected)</title>
    <link rel="stylesheet" href="style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <div class="header">
            <h2 id="welcomeText">Welcome, Dashboard</h2>
            <button onclick="logout()" class="btn-logout">Logout</button>
        </div>

        <div id="adminPanel" class="section card" style="display: none;">
            <h3>🛠️ Admin Panel (Online Control)</h3>
            
            <div style="margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px dashed #ccc;">
                <h4 style="margin-bottom: 10px; color: #4f46e5;">📂 Add New Class Note</h4>
                <div class="input-group">
                    <input type="text" id="noteTitle" placeholder="Note Title (e.g., Physics Lecture 1)">
                    <input type="text" id="noteLink" placeholder="Google Drive Link">
                    <button onclick="addNote()" class="btn" style="margin-top: 10px;">Upload to Cloud Database</button>
                </div>
            </div>

            <div>
                <h4 style="margin-bottom: 10px; color: #4f46e5;">📝 Add New Question for Exam</h4>
                <div class="input-group">
                    <input type="text" id="quizQuestion" placeholder="Enter the question"><br>
                    <input type="text" id="opt1" placeholder="Option 1"><br>
                    <input type="text" id="opt2" placeholder="Option 2"><br>
                    <input type="text" id="opt3" placeholder="Option 3"><br>
                    <input type="text" id="opt4" placeholder="Option 4"><br>
                    <label>Which option number is correct? (Enter 1, 2, 3, or 4)</label>
                    <input type="number" id="correctOpt" min="1" max="4" placeholder="e.g., 1">
                    <button onclick="addQuestion()" class="btn" style="margin-top: 10px; background: linear-gradient(135deg, #06b6d4, #3b82f6);">Add Question to Cloud</button>
                </div>
            </div>
        </div>

        <div class="section">
            <h3>📂 Available Class Notes (Live Online)</h3>
            <div id="notesList" class="notes-grid">
                <p style="color: #64748b;">Loading notes...</p>
            </div>
        </div>

        <div class="section card">
            <h3>📝 Online Exam Portal</h3>
            
            <div id="examStartView" style="text-align: center; padding: 20px;">
                <p style="font-size: 16px; margin-bottom: 15px;">
                    <strong>Topic:</strong> Admin's Live Quiz <br> 
                    <strong>Time:</strong> 30 Minutes | <strong>Total Questions:</strong> <span id="totalQuestionsCount">0</span>
                </p>
                <button onclick="startExam()" class="btn" style="max-width: 200px;">Start Exam</button>
            </div>

            <div id="examActiveView" style="display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #f0f2f5; padding: 10px; border-radius: 8px;">
                    <span style="font-weight: bold; color: #4f46e5;">Exam in progress...</span>
                    <span id="timerBox" style="font-weight: bold; color: #ef4444; font-size: 18px;">⏰ Time Remaining: 30:00</span>
                </div>

                <form id="examForm">
                    <div id="dynamicQuestionsContainer">
                        </div>
                    <button type="button" onclick="submitExam()" class="btn" style="margin-top: 20px;">Submit Exam</button>
                </form>
            </div>

            <div id="examResultView" style="display: none; text-align: center; padding: 20px;">
                <h4 id="scoreText" style="font-size: 22px; color: #10b981; margin-bottom: 15px;"></h4>
                <button onclick="resetExam()" class="btn" style="max-width: 200px; background: #64748b;">Retake Exam</button>
            </div>
        </div>
    </div>

    <script>
        // 🛠️ Firebase Configuration (Connected with your actual project keys)
        const firebaseConfig = {
            apiKey: "AIzaSyBKkjDB1ickFQ9FJdvGENQQ7ZeLk7hnBGI",
            authDomain: "class-notes-hub-61b20.firebaseapp.com",
            projectId: "class-notes-hub-61b20",
            storageBucket: "class-notes-hub-61b20.firebasestorage.app",
            messagingSenderId: "112494248768",
            appId: "1:112494248768:web:ea968e4f0c2ffcc39c70a5",
            measurementId: "G-69S13B95M6"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Role Authorization Check
        const role = localStorage.getItem('role');
        if (!role) { window.location.href = "index.html"; }

        if (role === 'admin') {
            document.getElementById('welcomeText').innerText = "Welcome, Admin Teacher!";
            document.getElementById('adminPanel').style.display = "block";
        } else {
            document.getElementById('welcomeText').innerText = "Welcome, Student Portal!";
        }

        let onlineQuestions = [];

        // 📂 1. Sync Class Notes from Firebase in Real-time
        function syncNotes() {
            db.collection("notes").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                const notesList = document.getElementById('notesList');
                notesList.innerHTML = "";
                
                if(snapshot.empty) {
                    notesList.innerHTML = "<p style='color: #64748b;'>No notes available at the moment.</p>";
                    return;
                }

                snapshot.forEach((doc) => {
                    const note = doc.data();
                    notesList.innerHTML += `
    <div class="note-card">
        <h4>${note.title}</h4>
        <a href="${note.link}" target="_blank" class="btn-download">View / Download PDF</a>
        
        <div class="action-buttons" style="margin-top: 10px; display: flex; gap: 10px;">
            <button onclick="editNote('${doc.id}', '${note.title}', '${note.link}')" style="background: #f59e0b; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">✏️ Edit</button>
            <button onclick="deleteNote('${doc.id}')" style="background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">🗑️ Delete</button>
        </div>
    </div>
`;
                });
            });
        }

        // 📂 2. Upload Note (Admin Feature)
        function addNote() {
            const title = document.getElementById('noteTitle').value;
            const link = document.getElementById('noteLink').value;
            if(title === "" || link === "") { alert("Please provide both note title and link!"); return; }

            db.collection("notes").add({
                title: title,
                link: link,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("New note successfully saved to cloud database!");
                document.getElementById('noteTitle').value = "";
                document.getElementById('noteLink').value = "";
            })
            .catch((error) => console.error("Error adding note: ", error));
        }

        // 📝 3. Sync Quiz Questions from Firebase
        function syncQuestions() {
            db.collection("quizzes").orderBy("createdAt", "asc").onSnapshot((snapshot) => {
                onlineQuestions = [];
                snapshot.forEach((doc) => {
                    onlineQuestions.push(doc.data());
                });
                document.getElementById('totalQuestionsCount').innerText = onlineQuestions.length;
            });
        }

        // 📝 4. Add Question (Admin Feature)
        function addQuestion() {
            const qText = document.getElementById('quizQuestion').value;
            const o1 = document.getElementById('opt1').value;
            const o2 = document.getElementById('opt2').value;
            const o3 = document.getElementById('opt3').value;
            const o4 = document.getElementById('opt4').value;
            const correct = parseInt(document.getElementById('correctOpt').value);

            if(!qText || !o1 || !o2 || !o3 || !o4 || !correct) {
                alert("Please fill out all fields completely!");
                return;
            }

            db.collection("quizzes").add({
                q: qText,
                os: [o1, o2, o3, o4],
                a: correct,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            })
            .then(() => {
                alert("Question successfully saved to Firebase!");
                document.getElementById('quizQuestion').value = "";
                document.getElementById('opt1').value = "";
                document.getElementById('opt2').value = "";
                document.getElementById('opt3').value = "";
                document.getElementById('opt4').value = "";
                document.getElementById('correctOpt').value = "";
            })
            .catch((error) => console.error("Error adding question: ", error));
        }

        // 📝 5. Render Questions on the Student Screen
        function loadExamQuestions() {
            const container = document.getElementById('dynamicQuestionsContainer');
            container.innerHTML = "";

            onlineQuestions.forEach((question, index) => {
                let optionsHtml = "";
                question.os.forEach((option, oIndex) => {
                    optionsHtml += `
                        <input type="radio" name="question_${index}" value="${oIndex + 1}"> ${option}<br>
                    `;
                });

                container.innerHTML += `
                    <div class="quiz-block" style="margin-bottom: 25px; background: #f8fafc; padding: 15px; border-radius: 8px;">
                        <p><strong>${index + 1}. ${question.q}</strong></p>
                        ${optionsHtml}
                    </div>
                `;
            });
        }

        // ⏰ Timer Logic (30 Minutes = 1800 Seconds)
        let timer;
        let timeLeft = 1800; 

        function startExam() {
            if(onlineQuestions.length === 0) { alert("There are no questions in this exam yet!"); return; }

            loadExamQuestions();
            document.getElementById('examStartView').style.display = "none";
            document.getElementById('examActiveView').style.display = "block";
            
            timeLeft = 1800; 
            updateTimerDisplay();
            
            timer = setInterval(function() {
                timeLeft--;
                updateTimerDisplay();
                
                if(timeLeft <= 0) {
                    clearInterval(timer);
                    alert("⏰ Time is up! Your exam is being submitted automatically.");
                    submitExam();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let minutes = Math.floor(timeLeft / 60);
            let seconds = timeLeft % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds; 
            document.getElementById('timerBox').innerText = `⏰ Time Remaining: ${minutes}:${seconds}`;
        }

        function submitExam() {
            clearInterval(timer);
            let score = 0;
            
            onlineQuestions.forEach((question, index) => {
                const selectedOption = document.querySelector(`input[name="question_${index}"]:checked`);
                if (selectedOption && parseInt(selectedOption.value) === question.a) {
                    score++;
                }
            });

            document.getElementById('examActiveView').style.display = "none";
            document.getElementById('examResultView').style.display = "block";
            document.getElementById('scoreText').innerText = `🎉 Exam Completed! Your Score: ${score} / ${onlineQuestions.length}`;
        }

        function resetExam() {
            document.getElementById('examForm').reset();
            document.getElementById('examResultView').style.display = "none";
            document.getElementById('examStartView').style.display = "block";
        }

        function logout() {
            localStorage.removeItem('role');
            window.location.href = "index.html";
        }

        // Fetch online data upon loading the script
        syncNotes();
        syncQuestions();
        // 1. Function to delete a note from Firebase
function deleteNote(noteId) {
    if (confirm("Are you sure you want to delete this note?")) {
        db.collection("notes").doc(noteId).delete().then(() => {
            alert("Note deleted successfully!");
            location.reload(); // Refresh the page to update the list
        }).catch((error) => {
            console.error("Error removing document: ", error);
        });
    }
}

// 2. Function to edit/update a note in Firebase
function editNote(noteId, currentTitle, currentLink) {
    const newTitle = prompt("Enter new note title:", currentTitle);
    const newLink = prompt("Enter new Google Drive link:", currentLink);

    // Check if the user didn't click cancel and filled both fields
    if (newTitle && newLink) {
        db.collection("notes").doc(noteId).update({
            title: newTitle,
            link: newLink
        })
        .then(() => {
            alert("Note updated successfully!");
            location.reload(); // Refresh the page to update the list
        })
        .catch((error) => {
            console.error("Error updating document: ", error);
        });
    }
}
    </script>




</body>
</html>
